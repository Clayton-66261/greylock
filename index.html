<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1E2B24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greylock">
<meta name="description" content="Massachusetts hunting map: land ownership, public land, pins, tracks, wind and seasons. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<title>Greylock</title>
<style>
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Barlow SC"; src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Barlow SC"; src: url("fonts/barlow-semi-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow SC"; src: url("fonts/barlow-semi-condensed-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }

/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --hemlock: #1E2B24;        /* strip, tab bar */
  --hemlock-2: #2A3A31;
  --blaze: #FF6A13;          /* you, time-critical, primary action */
  --blaze-ink: #1A0E05;
  --surface: #F2F5EF;        /* sheets in daylight */
  --surface-2: #E2E8DC;
  --ink: #17201B;
  --ink-2: #4B5B51;
  --line: #C6D0C1;
  --public: #2F7D45;
  --private: #A4472E;
  --restricted: #8A6A1F;
  --water: #2C6E99;
  --strip-ink: #EEF2EB;
  --strip-ink-2: #A9B9AE;
  --shadow: 0 6px 24px rgba(10, 20, 14, .28);
  --tabs-h: 60px;
  --strip-h: 58px;
  --r-sheet: 18px;
  --r-ctl: 14px;
  --font-body: "Atkinson", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Barlow SC", "Arial Narrow", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #18211C;
  --surface-2: #233029;
  --ink: #E7ECE5;
  --ink-2: #A3B2A8;
  --line: #34433A;
  --public: #5DBB75;
  --private: #E0805F;
  --restricted: #D7B24E;
  --water: #6FB2E0;
}
/* Red night mode: keeps dark-adapted eyes before first light */
:root[data-theme="night"] {
  color-scheme: dark;
  --hemlock: #160404;
  --hemlock-2: #240707;
  --blaze: #D83A22;
  --blaze-ink: #160404;
  --surface: #120303;
  --surface-2: #1F0606;
  --ink: #E2563E;
  --ink-2: #A2392A;
  --line: #3A0D0A;
  --public: #E2563E;
  --private: #E2563E;
  --restricted: #E2563E;
  --water: #E2563E;
  --strip-ink: #E2563E;
  --strip-ink-2: #9A3426;
}
:root[data-theme="night"] .leaflet-tile-pane { filter: brightness(.5) sepia(1) saturate(3.2) hue-rotate(-38deg); }
:root[data-theme="night"] .leaflet-marker-pane,
:root[data-theme="night"] .leaflet-overlay-pane { filter: sepia(1) saturate(4) hue-rotate(-38deg) brightness(.85); }

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--hemlock); }
body { font-family: var(--font-body); color: var(--ink); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }
a { color: inherit; }
input, select, textarea { font: inherit; color: var(--ink); }
svg { display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#map { position: fixed; inset: 0; background: #2b3530; }
.leaflet-container { font-family: var(--font-body); background: #2b3530; }
.lyr-lidar { mix-blend-mode: multiply; }
.leaflet-control-attribution { font-size: 10px; background: rgba(242,245,239,.7) !important; border-radius: 6px 0 0 0; }
.leaflet-bottom { bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom)); }
.leaflet-tooltip.wmz-label { background: none; border: 0; box-shadow: none; color: #fff; font: 700 15px/1 var(--font-data); text-shadow: 0 0 3px #000, 0 0 6px #000; padding: 0; }
.leaflet-tooltip.wmz-label::before { display: none; }

/* center crosshair, used by "Drop pin" */
.crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; z-index: 450; opacity: .85; }
.crosshair::before, .crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
.crosshair::before { left: 12px; top: 0; width: 2px; height: 26px; }
.crosshair::after { top: 12px; left: 0; height: 2px; width: 26px; }

/* ---------- Top strip ---------- */
.strip {
  position: fixed; left: 0; right: 0; top: 0; z-index: 900;
  padding: calc(env(safe-area-inset-top) + 6px) 10px 8px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  background: color-mix(in srgb, var(--hemlock) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--strip-ink);
}
.zone { display: grid; place-items: center; min-width: 54px; height: 44px; padding: 0 8px; border-radius: 10px; background: var(--hemlock-2); font-family: var(--font-data); line-height: 1; }
.zone b { font-size: 21px; font-weight: 700; }
.zone small { font-size: 11px; color: var(--strip-ink-2); margin-top: 2px; font-weight: 500; }
.light { min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.light-main { font-family: var(--font-data); font-weight: 600; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.light-main.hot { color: var(--blaze); }
.light-sub { font-size: 12.5px; color: var(--strip-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wind { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border-radius: 10px; background: var(--hemlock-2); font-family: var(--font-data); font-weight: 600; font-size: 17px; }
.wind svg { width: 22px; height: 22px; transition: transform .4s ease; }

/* status chips under the strip */
.chips { position: fixed; z-index: 890; left: 10px; right: 76px; top: calc(env(safe-area-inset-top) + var(--strip-h) + 10px); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
.chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--hemlock); color: var(--strip-ink); font-family: var(--font-data); font-weight: 600; font-size: 15.5px; box-shadow: var(--shadow); max-width: 100%; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #E5322B; animation: pulse 1.6s infinite; flex: none; }
.chip svg { width: 18px; height: 18px; flex: none; }
.chip.offline { background: #3A2F12; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- Map buttons ---------- */
.fabs { position: fixed; right: 10px; top: calc(env(safe-area-inset-top) + var(--strip-h) + 10px); z-index: 880; display: flex; flex-direction: column; gap: 10px; }
.fab { width: 52px; height: 52px; border-radius: var(--r-ctl); display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.fab svg { width: 26px; height: 26px; }
.fab.on { background: var(--blaze); color: var(--blaze-ink); }
.fab.follow { background: var(--hemlock); color: var(--blaze); }
.pin-fab {
  position: fixed; z-index: 880; left: 12px; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 14px);
  height: 52px; padding: 0 20px 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
  background: var(--blaze); color: var(--blaze-ink); font-family: var(--font-data); font-weight: 700; font-size: 18px; box-shadow: var(--shadow);
}
.pin-fab svg { width: 22px; height: 22px; }
body.sheet-open .pin-fab, body.sheet-open .crosshair { display: none; }

/* ---------- Tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  height: calc(var(--tabs-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr); background: var(--hemlock); color: var(--strip-ink-2);
}
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: var(--font-data); font-weight: 600; font-size: 13px; }
.tabs svg { width: 25px; height: 25px; }
.tabs button.on { color: var(--strip-ink); }
.tabs button.on svg { color: var(--blaze); }

/* ---------- Sheet ---------- */
.sheet {
  position: fixed; left: 0; right: 0; z-index: 950; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom));
  max-height: calc(100% - var(--tabs-h) - env(safe-area-inset-bottom) - env(safe-area-inset-top) - var(--strip-h) - 14px);
  display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3);
  transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
.sheet.open { transform: translateY(0); visibility: visible; }
.sheet.tall { height: 72vh; }
@media (min-width: 720px) { .sheet { left: auto; width: 440px; right: 12px; border-radius: var(--r-sheet); bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 12px); } }
.sheet-grip { height: 20px; display: grid; place-items: center; touch-action: none; flex: none; }
.sheet-grip span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 0 12px 6px 18px; flex: none; }
.sheet-head h2 { margin: 0; flex: 1; font-family: var(--font-data); font-weight: 700; font-size: 24px; line-height: 1.1; }
.sheet-head .x { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.sheet-head .x svg { width: 22px; height: 22px; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px calc(20px + env(safe-area-inset-bottom) * 0); overscroll-behavior: contain; }

/* ---------- Sheet content ---------- */
.sec { padding: 14px 0; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 2px; }
.sec h3 { margin: 0 0 8px; font-family: var(--font-data); font-weight: 700; font-size: 17px; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.big { font-family: var(--font-data); font-weight: 700; font-size: 28px; line-height: 1.1; }
.owner { font-family: var(--font-data); font-weight: 700; font-size: 26px; line-height: 1.12; margin: 4px 0 2px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-family: var(--font-data); font-weight: 700; font-size: 14.5px; color: #fff; }
.badge.public { background: var(--public); }
.badge.private { background: var(--private); }
.badge.restricted { background: var(--restricted); }
.badge.neutral { background: var(--ink-2); }
:root[data-theme="night"] .badge { color: var(--surface); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0 0; }
dl.kv dt { color: var(--ink-2); font-size: 14.5px; }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.btn { text-decoration: none; min-height: 46px; padding: 0 16px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface-2); color: var(--ink); font-family: var(--font-data); font-weight: 600; font-size: 16.5px; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--blaze); color: var(--blaze-ink); }
.btn.danger { color: var(--private); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.note { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }
.warn { font-size: 14.5px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--restricted) 18%, transparent); margin-top: 10px; }

/* segmented + toggles */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.seg button { min-height: 42px; border-radius: 9px; font-family: var(--font-data); font-weight: 600; font-size: 15.5px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.toggle { display: flex; align-items: center; gap: 12px; min-height: 52px; width: 100%; text-align: left; }
.toggle .t-text { flex: 1; }
.toggle .t-text small { display: block; color: var(--ink-2); font-size: 13.5px; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.toggle[aria-pressed="true"] .switch { background: var(--blaze); }
.toggle[aria-pressed="true"] .switch::after { transform: translateX(20px); }
.bases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bases button { border-radius: 12px; overflow: hidden; border: 2px solid transparent; background: var(--surface-2); text-align: left; }
.bases button.on { border-color: var(--blaze); }
.bases .swatch { height: 56px; }
.bases span { display: block; padding: 6px 8px; font-family: var(--font-data); font-weight: 600; font-size: 14.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 2px 0 8px 2px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* forms */
label.f { display: block; margin: 12px 0 4px; font-size: 14.5px; color: var(--ink-2); }
.input { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); }
textarea.input { min-height: 84px; resize: vertical; }
.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.types button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; border: 2px solid transparent; background: var(--surface-2); font-size: 12.5px; line-height: 1.15; text-align: center; }
.types button.on { border-color: var(--blaze); }
.types .ti { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.types .ti svg { width: 20px; height: 20px; }
.compass8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.compass8 button { min-height: 42px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-data); font-weight: 700; font-size: 15px; }
.compass8 button.on { background: var(--public); color: #fff; }
.photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; margin-top: 8px; background: var(--surface-2); }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 0; text-align: left; }
.item .ti { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.item .ti svg { width: 20px; height: 20px; }
.item .meta { flex: 1; min-width: 0; }
.item .meta b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta small { color: var(--ink-2); font-size: 14px; }
.item .end { font-family: var(--font-data); font-weight: 600; text-align: right; white-space: nowrap; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.filters button { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-data); font-weight: 600; font-size: 15px; }
.filters button.on { background: var(--ink); color: var(--surface); }
.empty { padding: 18px 0; color: var(--ink-2); }

/* weather */
.wx-now { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.wx-temp { font-family: var(--font-data); font-weight: 700; font-size: 54px; line-height: 1; }
.wx-wind { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.wx-wind .arrow { width: 54px; height: 54px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.wx-wind .arrow svg { width: 34px; height: 34px; color: var(--blaze); }
.hours { display: flex; gap: 6px; overflow-x: auto; margin: 0 -18px; padding: 2px 18px 8px; scrollbar-width: none; }
.hour { flex: none; width: 62px; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); text-align: center; font-family: var(--font-data); font-weight: 600; font-size: 14.5px; line-height: 1.25; }
.hour svg { width: 24px; height: 24px; margin: 4px auto; color: var(--ink); }
.hour.now { outline: 2px solid var(--blaze); }
.days { width: 100%; border-collapse: collapse; font-size: 15px; }
.days td { padding: 8px 4px; border-top: 1px solid var(--line); }
.days td.n { font-family: var(--font-data); font-weight: 600; text-align: right; white-space: nowrap; }
.suntimes { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
.suntimes .t { font-family: var(--font-data); font-weight: 600; text-align: right; }
.suntimes .legal { color: var(--blaze); font-weight: 700; }

/* regs */
.today-card { padding: 14px; border-radius: 14px; background: var(--hemlock); color: var(--strip-ink); }
.today-card h3 { color: var(--strip-ink-2); margin: 0 0 6px; }
.today-card ul { margin: 6px 0 0; padding-left: 18px; }
.today-card li { margin: 3px 0; }
.season { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; }
.season:first-of-type { border-top: 0; }
.season .st { width: 10px; height: 10px; border-radius: 50%; background: var(--line); align-self: center; }
.season.open .st { background: var(--public); }
.season .nm { font-weight: 700; }
.season .dt { font-family: var(--font-data); font-weight: 600; text-align: right; font-size: 15px; }
.season .dt .past { color: var(--ink-2); text-decoration: line-through; font-weight: 500; }
.season .nt { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink-2); }
.rule { margin: 0 0 12px; }
.rule b { display: block; }
.links a { display: block; padding: 8px 0; }

/* progress */
.bar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--blaze); transition: width .2s; }

/* map markers */
.me { position: relative; width: 22px; height: 22px; }
.me .core { position: absolute; inset: 3px; border-radius: 50%; background: var(--blaze); border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.4); }
.me .cone { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; display: none; }
.me.has-heading .cone { display: block; }
.pin-icon { filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }

/* toast */
.toast { position: fixed; z-index: 1100; left: 50%; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom) + 80px); transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; transition: all .22s; background: var(--hemlock); color: var(--strip-ink); padding: 11px 16px; border-radius: 12px; font-size: 15px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Hunting map"></div>
<div class="crosshair" aria-hidden="true"></div>

<header class="strip">
  <button class="zone" id="zoneChip" data-act="tab" data-tab="regs" aria-label="Wildlife Management Zone, open seasons">
    <b id="zoneNum">–</b><small>WMZ</small>
  </button>
  <div class="light" aria-live="polite">
    <span class="light-main" id="lightMain">Finding you…</span>
    <span class="light-sub" id="lightSub">Legal light shows once location is known</span>
  </div>
  <button class="wind" id="windChip" data-act="tab" data-tab="weather" aria-label="Wind and weather">
    <svg viewBox="0 0 24 24" id="windArrow" aria-hidden="true"><path d="M12 3v18M12 21l-5-5M12 21l5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="windText">–</span>
  </button>
</header>

<div class="chips" id="chips"></div>

<div class="fabs">
  <button class="fab" data-act="tab" data-tab="layers" aria-label="Map layers and offline maps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
  </button>
  <button class="fab" id="btnLocate" data-act="locate" aria-label="Center on my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="fab" id="btnCone" data-act="cone" aria-label="Show scent cone downwind" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12L20 5v14z" opacity=".35" fill="currentColor" stroke="none"/><path d="M5 12L20 5M5 12l15 7"/><circle cx="5" cy="12" r="2" fill="currentColor"/></svg>
  </button>
</div>

<button class="pin-fab" data-act="drop-pin" aria-label="Drop a pin at the crosshair">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  Drop pin
</button>

<section class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip" id="sheetGrip"><span></span></div>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="x" data-act="close-sheet" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-act="tab" data-tab="map" class="on" aria-label="Map">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span>
  </button>
  <button data-act="tab" data-tab="pins" aria-label="Pins">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Pins</span>
  </button>
  <button data-act="tab" data-tab="tracks" aria-label="Tracks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 19h6a3 3 0 0 0 0-6H11a3 3 0 0 1 0-6h6" stroke-dasharray="2.5 2.5"/></svg><span>Tracks</span>
  </button>
  <button data-act="tab" data-tab="weather" aria-label="Weather">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg><span>Wind</span>
  </button>
  <button data-act="tab" data-tab="regs" aria-label="Seasons and regulations">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke-linecap="round"/><path d="M8.5 14.5l2 2 4-4" stroke-linecap="round"/></svg><span>Seasons</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/suncalc.js"></script>
<script src="seasons.js"></script>
<script src="app.js"></script>
</body>
</html>
